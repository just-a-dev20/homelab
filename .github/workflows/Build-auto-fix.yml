name: Build AI Auto-Fix

on:
  workflow_run:
    workflows: ["build"]
    types: [completed]

jobs:
  auto-fix-ublue:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Download Build Logs
        uses: actions/github-script@v7
        with:
          script: |
            const run_id = ${{ github.event.workflow_run.id }};
            const logs = await github.rest.actions.downloadWorkflowRunLogs({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: run_id,
            });
            const fs = require('fs');
            fs.writeFileSync('build_logs.zip', Buffer.from(logs.data));

      - name: Parse Container / rpm-ostree Failures
        run: |
          unzip -q build_logs.zip -d logs/
          # Extract relevant errors (rpm-ostree conflicts, copr errors, podman/buildah steps)
          grep -i -E "error:|failed:|rpm-ostree|copr|Containerfile" logs/* -C 3 > failure_context.txt || echo "Build failed during image generation" > failure_context.txt
          head -n 250 failure_context.txt > error_trimmed.txt

      - name: Generate AI Fix with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          ERROR_LOG=$(cat error_trimmed.txt)

          # Auto-detect BlueBuild (recipes/recipe.yml) or standard uBlue (Containerfile)
          TARGET_FILE="Containerfile"
          if [ -f "recipes/recipe.yml" ]; then
            TARGET_FILE="recipes/recipe.yml"
          elif [ -f "config/recipe.yml" ]; then
            TARGET_FILE="config/recipe.yml"
          fi

          FILE_CONTENT=$(cat "$TARGET_FILE")

          PROMPT="You are an expert in Universal Blue (uBlue) Fedora bootc container builds, rpm-ostree, and BlueBuild recipes.
          The image build failed with the following error log:
          ---
          $ERROR_LOG
          ---

          Current content of $TARGET_FILE:
          ---
          $FILE_CONTENT
          ---

          Fix the issue (e.g., remove broken package, fix COPR repo name, fix YAML syntax, or adjust build step).
          Return ONLY the valid, raw full contents of $TARGET_FILE without markdown quotes or explanation."

          # Call Gemini 2.5 Flash Free API
          RESPONSE=$(curl -s "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}" \
            -H 'Content-Type: application/json' \
            -d "{
              \"contents\": [{
                \"parts\": [{
                  \"text\": $(jq -Rn --arg str "$PROMPT" '$str')
                }]
              }]
            }")

          # Write fix back to the target file
          echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text' | sed 's/^```[a-z]*//; s/```$//' > "$TARGET_FILE"

      - name: Open Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "fix(Build): auto-resolve container build error"
          title: "🤖 AI Fix: Resolve Image Build Failure"
          body: |
            ## Automated Build Fix
            This PR was generated automatically by **Gemini 2.5 Flash** after workflow run #${{ github.event.workflow_run.id }} failed.

            **Common issues addressed:**
            * Package name changes or conflicts in Fedora / COPR repositories.
            * `rpm-ostree` overlay errors.
            * Syntax errors in `recipe.yml` or `Containerfile`.
          branch: "ai-fix-ublue-${{ github.event.workflow_run.id }}"
          delete-branch: true
